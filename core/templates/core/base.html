{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}{{ S.CLUB_NAME }} · {{ S.ALBUM_TITLE }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/site.css' %}?v={{ V }}"></head>
<body><header class="bar"><a class="brand" href="{% url 'home' %}">{{ S.CLUB_NAME }}</a>
<nav><a href="{% url 'about' %}">Our story</a><a href="{% url 'home' %}#give" class="pill">Give</a></nav></header>
<main>{% block content %}{% endblock %}</main>
<div id="toast" class="toast" role="alert" hidden></div>
<footer><p>{{ S.CLUB_NAME }} · {{ S.SAYING }}, {{ S.SAYING_EN|lower }}.</p></footer>
{% block js %}{% endblock %}</body></html>
